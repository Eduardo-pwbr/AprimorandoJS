<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./output.css">
  <title>Document</title>
</head>
<body class="">
  <div class="container w-screen max-w-none flex items-center h-screen justify-center gap-10 p-10">


    <div class=" flex-row flex-1 items-center justify-center  ">
     <img class="rounded-2xl max-w-[550px]  max-h-[700px] " src="../imagens/peso.jpg" alt="">
    </div>
    
    <div class=" flex-row flex-1 items-center justify-center  ">
      <h1 class=" flex flex-row justify-center text-3xl mb-2  font-semibold text-blue-500">Programa Cálculo do Peso</h1>

     <form class=" border-1 border-solid border-b-current p-4 rounded-2xl shadow-lg space-y-4 w-11/12 " >
    <h2 class="text-2xl font-bold text-center text-gray-800">Formulário</h2>

    <input type="text" placeholder="Nome completo" id="inNome"
      class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />

    <div class="flex flex-row gap-3  items-center ">
    <label  class=" text-gray-700 font-semibold ">Sexo:  </label>
    <input type="radio" name="sexo" id="inMasculino"/> Masculino
    <input type="radio" name="sexo" id="inFeminino"/> Feminino
   </div>

    <input type="text" placeholder="Altura" id="inAltura"
      class="w-full p-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" />

   

    <button type="submit"
      class=" w-[150px] flex-1 bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
      Enviar
    </button>
     <button type="submit"
      class="  w-[150px] bg-blue-600 text-white font-semibold py-3 rounded-lg hover:bg-blue-700 transition">
      Cancelar
    </button>
    <h3></h3>
  </form>
    </div>
</div>
  
  <script src="../js/calculoDopeso.js"></script>
</body>
</html>
