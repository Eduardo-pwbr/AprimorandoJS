<!DOCTYPE html>
<html>
  <head>
    <!--Import Google Icon Font-->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <!--Import materialize.css-->
    <link
      type="text/css"
      rel="stylesheet"
      href="css/materialize.min.css"
      media="screen,projection"
    />

    <!--Let browser know website is optimized for mobile-->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <style type="text/css">
      .underlined {
        border-bottom: 3px solid currentColor;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div
        class="hero center card-panel materialize-red darken-4 white-text z-depth-3"
      >
        <h1 class="materialize-red-text text-lighten-3">
          Relatório de Médias dos Alunos
        </h1>
      </div>
      <h2 class="materialize-red-text text-lighten-2 underlined">
        Dados de Alunos
      </h2>

      <table class="striped">
        <thead></thead>

        <tbody></tbody>
      </table>
    </div>

    <!--JavaScript at end of body for optimized loading-->
    <!-- <script type="text/javascript" src="js/materialize.min.js"></script> -->
    <script src="/js/calc.js"></script>
    <script>
      (function () {
        const alunos = [
          { nome: "Daniel", notas: [10, 3, 7.5, 3] },
          { nome: "Maria", notas: [10, 9, 3, 9.5] },
          { nome: "João", notas: [10, 4.5, 1, 3.5] },
          { nome: "Joana", notas: [1, 3, 9, 1.5] },
          { nome: "José", notas: [10, 4.5, 7, 3] },
          { nome: "Arnaldo", notas: [10, 4.5, 7, 3] },
          { nome: "Lucas", notas: [4.5, 9, 8, 3] },
          { nome: "Luana", notas: [3, 7, 9, 3] },
          { nome: "Beatriz", notas: [10, 4, 7, 9] },
          { nome: "Sergio", notas: [4.5, 9.5, 10, 2] },
        ];

        alunos.forEach((aluno) => {
          aluno.media = avarege(...aluno.notas);
          console.log(alunos);
        });

        const html = alunos.map(
          (aluno) => `
          <tr>
            <td>${aluno.nome}</td>
            <td>${aluno.notas[0]}</td>
            <td>${aluno.notas[1]}</td>
            <td>${aluno.notas[2]}</td>
            <td>${aluno.notas[3]}</td>
            <td>${aluno.media.toFixed(2)}</td>
            <td style="color: ${aluno.media >= 7.0 ? "green" : "red"}">
              ${aluno.media >= 7.0 ? "Aprovado" : "Reprovado"}
          </tr>
        `
        );
        document.querySelector("tbody").innerHTML = html.join("");
      })();
    </script>
  </body>
</html>
