<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/output.css">
  <title>Media do aluno</title>
</head>
<body>
  <div class="container p-4 mx-auto w-50% border border-gray-300  bg-white shadow-md ">
  <h1 class="font-bold mb-8">Programa Situação do Aluno</h1>
  <form action="#" >
  <p class="text-gray-500">
    Nome do Aluno:
    <input type="text" class=" border border-gray-300 rounded-2xl w-80 pb-4 "   id="inNome" placeholder="Digite o nome do aluno">
  </p>
  <p class="text-gray-500 font-sans ">
    Nota 1:
    <input type="number" id="inNota1" class=" border border-gray-300 rounded-2xl w-80 "  id="inNome" placeholder="Digite a primeira nota">
  </p>
  <p class="text-gray-500">
    Nota 2:
    <input type="number" id="inNota2"   id="inNome" placeholder="Digite a segunda nota">
  </p>
  <input type="submit" value="Calcular Média" class=" bg-blue-500 text-white py-2 px-4 rounded-md" >
  <h3 class="text-gray-500" id="resp1"></h3>
  <h3 class="text-gray-500" id="resp2"></h3>
</form>
</div>

  <script src="js/Exe4_1.js"></script>
</body>
</html>
